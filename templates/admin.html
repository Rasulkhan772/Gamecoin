<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Admin - GameCoin</title>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <nav class="navbar navbar-dark bg-dark">
    <div class="container-fluid">
      <span class="navbar-brand">Admin Dashboard</span>
      <a class="btn btn-outline-light" href="/logout">Logout</a>
    </div>
  </nav>

  <div class="container py-4">
    <div class="row g-4">
      <div class="col-12 col-lg-7">
        <div class="card shadow-sm rounded-4">
          <div class="card-body">
            <h5 class="card-title mb-3">Players</h5>
            <div class="table-responsive">
              <table class="table table-striped table-hover">
                <thead><tr><th>#</th><th>Username</th><th>Coins</th></tr></thead>
                <tbody>
                  {% for p in players %}
                  <tr><td>{{ loop.index }}</td><td>{{ p.username }}</td><td>{{ p.coins }}</td></tr>
                  {% endfor %}
                </tbody>
              </table>
            </div>
            <p class="text-muted small mb-0">Total: {{ players|length }} players</p>
          </div>
        </div>
      </div>

      <div class="col-12 col-lg-5">
        <div class="card shadow-sm rounded-4 mb-4">
          <div class="card-body">
            <h5 class="card-title">Add Coins</h5>
            <form method="post" action="/admin/add">
              <div class="mb-2">
                <label class="form-label">Player</label>
                <input name="player" class="form-control" placeholder="username" required>
              </div>
              <div class="mb-3">
                <label class="form-label">Amount</label>
                <input name="amount" type="number" min="1" class="form-control" required>
              </div>
              <button class="btn btn-success w-100">Add</button>
            </form>
          </div>
        </div>

        <div class="card shadow-sm rounded-4">
          <div class="card-body">
            <h5 class="card-title">Remove Coins</h5>
            <form method="post" action="/admin/remove">
              <div class="mb-2">
                <label class="form-label">Player</label>
                <input name="player" class="form-control" placeholder="username" required>
              </div>
              <div class="mb-3">
                <label class="form-label">Amount</label>
                <input name="amount" type="number" min="1" class="form-control" required>
              </div>
              <button class="btn btn-danger w-100">Remove</button>
            </form>
          </div>
        </div>

      </div>
    </div>
  </div>
</body>
</html>

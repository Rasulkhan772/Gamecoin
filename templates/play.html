{% extends "base.html" %}
{% block title %}Play - GameCoin{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <div class="card shadow-sm">
      <div class="card-body">
        <h4 class="card-title">Coin Toss</h4>
        <p>Your Balance: <span class="badge bg-info text-dark">{{ coins }} coins</span></p>
        <form method="post" novalidate>
          <div class="mb-3">
            <label class="form-label">Bet Amount</label>
            <input required name="bet_amount" type="number" min="1" class="form-control" placeholder="Enter amount">
          </div>
          <div class="mb-3">
            <label class="form-label">Choose</label>
            <div>
              <div class="form-check form-check-inline">
                <input class="form-check-input" type="radio" name="choice" id="heads" value="heads" checked>
                <label class="form-check-label" for="heads">Heads</label>
              </div>
              <div class="form-check form-check-inline">
                <input class="form-check-input" type="radio" name="choice" id="tails" value="tails">
                <label class="form-check-label" for="tails">Tails</label>
              </div>
            </div>
          </div>
          <button class="btn btn-primary w-100">Play</button>
        </form>
      </div>
    </div>
    <div class="mt-3 text-center">
      <a href="{{ url_for('player_dashboard') }}" class="btn btn-link">Back to Dashboard</a>
      <a href="{{ url_for('history') }}" class="btn btn-link">View Recent Bets</a>
    </div>
  </div>
</div>
{% endblock %}

<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Player - GameCoin</title>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    .coin { width:80px; height:80px; border-radius:50%; background:gold; margin:auto; }
    .coin.flip { animation: flip 2s ease; }
    @keyframes flip { from {transform: rotateY(0);} to {transform: rotateY(720deg);} }
  </style>
</head>
<body class="bg-light">
  <nav class="navbar navbar-dark bg-dark">
    <div class="container-fluid">
      <span class="navbar-brand">Welcome, {{ username }}</span>
      <a class="btn btn-outline-light" href="/logout">Logout</a>
    </div>
  </nav>

  <div class="container py-4 text-center">
    <h4>Balance: <span id="balance">{{ coins }}</span> coins</h4>

    <!-- Buttons -->
    <button class="btn btn-primary w-100 mt-3" onclick="playGame('coin_toss')">Play Coin Toss (5)</button>
    <div id="coin" class="coin mt-2"></div>

    <button class="btn btn-success w-100 mt-3" onclick="playGame('dice_roll')">Play Dice Roll (10)</button>
    <div id="dice" class="mt-2"></div>

    <button class="btn btn-warning w-100 mt-3" onclick="playGame('lucky7')">Play Lucky 7 (15)</button>
    <div id="slot" class="mt-2"></div>

    <p id="result" class="mt-3 fw-bold"></p>
  </div>

<script>
async function playGame(game) {
  const res = await fetch(`/api/play/${game}`, {method: "POST"});
  const data = await res.json();

  if (!data.success) {
    document.getElementById("result").innerText = data.msg;
    return;
  }

  document.getElementById("balance").innerText = data.coins;

  if (game === "coin_toss") {
    let coin = document.getElementById("coin");
    coin.classList.add("flip");
    setTimeout(() => {
      coin.classList.remove("flip");
      document.getElementById("result").innerText = data.msg;
    }, 2000);
  }

  if (game === "dice_roll") {
    let dice = document.getElementById("dice");
    dice.innerText = "🎲 rolling...";
    setTimeout(() => {
      dice.innerText = "🎲 " + data.dice;
      document.getElementById("result").innerText = data.msg;
    }, 2000);
  }

  if (game === "lucky7") {
    let slot = document.getElementById("slot");
    slot.innerText = "🎰 spinning...";
    setTimeout(() => {
      slot.innerText = "🎰 " + data.number;
      document.getElementById("result").innerText = data.msg;
    }, 2000);
  }
}
</script>
</body>
</html>
